<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسواق بدر</title>
<style id="pgs">@page{size:90mm auto;margin:0}</style>
<style>
:root{--bg:#f2f5f3;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0a9b57;--pri2:#067a44;--pl:#e3f6ec;--bd:#d6ddd9;--wr:#c2410c;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
button.p:hover{background:var(--pri2)}
button.d{color:var(--bad);border-color:var(--bad)}
button.f{flex:1}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
input[type=checkbox]{width:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.ttl{font-size:20px;font-weight:700;margin:4px 0 10px}
.pre{white-space:pre-line}
.err{color:var(--bad)}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th{background:var(--pl);color:var(--pri2);position:sticky;top:0}
th,td{border-bottom:1px solid var(--bd);padding:6px 5px;text-align:center}
td.l,th.l{text-align:right}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--pl)}
td input{padding:5px;text-align:center;direction:ltr;min-width:70px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.b-draft{background:#fde7d3;color:#9a3412}.b-done{background:#d5f2df;color:#166534}.b-cancel{background:#fbd5d5;color:#991b1b}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lbl{font-size:13px;color:var(--mut);margin:6px 0 2px}
/* shell */
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px}
#login img{width:220px;height:220px;object-fit:contain}
#login input,#login button{max-width:320px}
#app{display:flex;flex-direction:column;height:100vh}
#top{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:5px 12px}
#top img{height:40px;width:40px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
#top button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
#main{flex:1;overflow:auto;padding:12px}
#main.posm{padding:0;overflow:hidden}
.credit{text-align:center;font-size:11px;color:var(--mut);padding:2px;direction:ltr}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#mb{width:100%;max-width:460px;max-height:92vh;overflow:auto}
#mb .card{margin:0}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;z-index:30;display:none;max-width:90vw}
#toast.show{display:block}#toast.err{background:var(--bad)}
/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile2{background:#fff;border:2px solid var(--bd);border-radius:14px;padding:22px 14px;font-size:19px;font-weight:700;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:stretch}
button.tile2:hover{border-color:var(--pri);background:var(--pl)}
.tile2.open{border-color:var(--pri);background:var(--pl)}
/* POS */
.pos{display:flex;height:100%}
.op{width:390px;display:flex;flex-direction:column;background:#fff;border-inline-start:1px solid var(--bd)}
.oph{background:var(--pl);padding:8px 10px;font-weight:700;color:var(--pri2)}
.ol{flex:1;overflow:auto}
.ln{display:grid;grid-template-columns:1fr auto;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.ln.sel{background:#d3f0e0}
.ln .n{font-weight:700;grid-column:1/3}
.ln .dd{color:var(--mut);font-size:13px}
.ln .t{font-weight:700}
.ot{padding:8px 10px;font-size:22px;font-weight:700;display:flex;justify-content:space-between;border-top:2px solid var(--pri)}
.npd{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}
.npd button{padding:12px 0;font-size:20px}
.paybtn{margin:6px;padding:16px;font-size:20px}
.pm{flex:1;display:flex;flex-direction:column;min-width:0}
.pbar{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.pbar input{flex:1;min-width:200px}
.cats{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);white-space:nowrap}
.cats button{flex:none}
.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:6px;padding:8px;align-content:start}
.tile{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:82px;font-size:13px;text-align:center}
.tile:hover{border-color:var(--pri);background:var(--pl)}
.tile .pr{color:var(--pri2);font-weight:700;font-size:14px;margin-top:4px}
/* price inquiry */
.pq{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;text-align:center;gap:8px}
.pq .nm{font-size:44px;font-weight:700;line-height:1.3;max-width:92%}
.pq .pc{font-size:120px;font-weight:800;color:var(--pri);line-height:1.05;direction:ltr}
/* receipt (90mm) */
.rcpt{background:#fff;color:#000;font-size:12px;padding:3mm;margin:0 auto 10px;border:1px dashed var(--bd);direction:rtl;font-family:Tahoma,Arial,sans-serif;width:84mm}
.rcpt img{display:block;margin:0 auto;width:34mm;filter:grayscale(1) contrast(1.5)}
.rcpt .c{text-align:center}.rcpt .t{text-align:center;font-weight:700;font-size:14px}
.rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rcpt table{font-size:11px;background:#fff}.rcpt th,.rcpt td{border:0;padding:1px;color:#000;background:#fff;position:static}
.rcpt .nm{text-align:right}
.rr{display:flex;justify-content:space-between;font-weight:700;margin-top:3px;font-size:13px}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}body{background:#fff}#pa{display:block!important;border:0;margin:0}}
</style>
</head>
<body>
<div id="pa" class="rcpt"></div>
<div id="login">
  <img src="logo.png" alt="أسواق بدر">
  <input type="text" id="lu" placeholder="اسم المستخدم" autocomplete="off">
  <input type="password" id="lp" placeholder="الرقم السري" autocomplete="off">
  <div id="le" class="err" style="min-height:20px"></div>
  <button class="p" id="lb">تسجيل الدخول</button>
  <div class="credit">تصميم Mahmoud Thabet</div>
</div>
<div id="app" hidden>
  <div id="top">
    <img src="logo.png" alt="">
    <b style="font-size:18px">أسواق بدر</b>
    <span id="who" style="flex:1;opacity:.9"></span>
    <button data-a="home">🏠 الرئيسية</button>
    <button data-a="logout">خروج</button>
  </div>
  <div id="main"></div>
  <div class="credit">تصميم Mahmoud Thabet</div>
</div>
<div id="md" hidden><div id="mb"></div></div>
<div id="toast"></div>
<script src="xlsx.full.min.js"></script>
<script src="js/lib.js"></script>
<script src="js/data.js"></script>
<script src="js/pos.js"></script>
<script src="js/purch.js"></script>
<script src="js/inv.js"></script>
<script src="js/acc.js"></script>
<script src="js/hr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
